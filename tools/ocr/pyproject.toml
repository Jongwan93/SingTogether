[project]
name = "singtogether-ocr"
version = "0.1.0"
description = "악보 이미지/PDF → MusicXML (SingTogether OCR 모듈, 앱과 분리된 CLI)"
requires-python = ">=3.11,<3.16"
dependencies = [
    "homr>=0.7.0",
    "opencv-python-headless>=4.10,<5",
    "numpy",
    "pillow",
    "verovio>=5",
    "pymupdf>=1.24",
    "pyobjc-framework-Vision>=10",
    "pyobjc-framework-Quartz>=10",
]

[project.scripts]
singtogether-ocr = "singtogether_ocr.cli:main"
singtogether-eval = "singtogether_ocr.eval.compare:main"

[dependency-groups]
dev = ["pytest", "music21>=9"]   # music21은 평가(singtogether-eval)에만 쓴다. 앱 번들에는 안 들어간다

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["singtogether_ocr"]
