<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5856d6"/>
      <stop offset="1" stop-color="#8e44ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2e1065" flood-opacity="0.45"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#glow2)"/>

    <!-- staff: five lines along the bottom that rise toward the ring, like a melody moving up a key -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
      <path d="M-20 298 C 350 298, 600 292, 820 276 S 1100 246, 1220 232"/>
      <path d="M-20 312 C 350 312, 600 306, 820 290 S 1100 260, 1220 246"/>
      <path d="M-20 326 C 350 326, 600 320, 820 304 S 1100 274, 1220 260"/>
      <path d="M-20 340 C 350 340, 600 334, 820 318 S 1100 288, 1220 274"/>
      <path d="M-20 354 C 350 354, 600 348, 820 332 S 1100 302, 1220 288"/>
    </g>

    <!-- notes: a short phrase that climbs, ending in a beamed pair -->
    <g fill="#ffffff" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.92" stroke-width="3" stroke-linecap="round">
      <ellipse cx="748" cy="312" rx="10" ry="7" transform="rotate(-22 748 312)" stroke="none"/>
      <line x1="757" y1="309" x2="757" y2="262"/>
      <ellipse cx="798" cy="298" rx="10" ry="7" transform="rotate(-22 798 298)" fill="none"/>
      <line x1="807" y1="295" x2="807" y2="248"/>
      <ellipse cx="846" cy="284" rx="10" ry="7" transform="rotate(-22 846 284)" stroke="none"/>
      <line x1="855" y1="281" x2="855" y2="232"/>
      <ellipse cx="884" cy="272" rx="10" ry="7" transform="rotate(-22 884 272)" stroke="none"/>
      <line x1="893" y1="269" x2="893" y2="222"/>
      <path d="M855 232 L893 222 L893 230 L855 240 Z" stroke="none"/>
    </g>

    <!-- app icon tile -->
    <g filter="url(#shadow)">
      <rect x="72" y="92" width="120" height="120" rx="28" fill="url(#tile)"/>
      <rect x="72" y="92" width="120" height="120" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- eighth note drawn as paths so it sits in the middle on every platform (the glyph's position depends on the font) -->
      <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round">
        <ellipse cx="121" cy="178" rx="14" ry="10" transform="rotate(-20 121 178)" stroke="none"/>
        <line x1="133" y1="174" x2="133" y2="118" stroke-width="5"/>
        <path d="M133 118 c 20 10, 28 28, 16 50" fill="none" stroke-width="5"/>
      </g>
    </g>

    <!-- title -->
    <text x="224" y="152" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">SingTogether</text>
    <text x="226" y="196" font-size="23" font-weight="500" fill="#ffffff" fill-opacity="0.9">Transpose any score to the key you can actually sing.</text>

    <!-- three steps in pills -->
    <g font-size="15" font-weight="600" fill="#ffffff">
      <rect x="226" y="222" width="188" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="320" y="245" text-anchor="middle">⇧ drag a score</text>
      <rect x="426" y="222" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="485" y="245" text-anchor="middle">pick a key</text>
      <rect x="556" y="222" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="631" y="245" text-anchor="middle">drop · done</text>
    </g>

    <!-- the ring, drawn like the app: +1…+5 clockwise from the top, −1…−5 counter-clockwise, +2 chosen -->
    <g transform="translate(1040 172)" filter="url(#shadow)">
      <path d="M2.0 -112.0 A112 112 0 0 1 64.2 -91.7 L22.9 -32.8 A40 40 0 0 0 0.7 -40.0 Z" fill="#293445" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="24.7" y="-80.1" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Ab</text>
      <text x="24.7" y="-63.1" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">+1</text>
      <path d="M67.4 -89.4 A112 112 0 0 1 105.9 -36.5 L37.8 -13.0 A40 40 0 0 0 24.1 -31.9 Z" fill="#0a84ff" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="64.7" y="-51.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">A</text>
      <text x="64.7" y="-34.0" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">+2</text>
      <path d="M107.1 -32.7 A112 112 0 0 1 107.1 32.7 L38.3 11.7 A40 40 0 0 0 38.3 -11.7 Z" fill="#293445" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="80.0" y="-4.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Bb</text>
      <text x="80.0" y="13.0" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">+3</text>
      <path d="M105.9 36.5 A112 112 0 0 1 67.4 89.4 L24.1 31.9 A40 40 0 0 0 37.8 13.0 Z" fill="#293445" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="64.7" y="43.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">B</text>
      <text x="64.7" y="60.0" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">+4</text>
      <path d="M64.2 91.7 A112 112 0 0 1 2.0 112.0 L0.7 40.0 A40 40 0 0 0 22.9 32.8 Z" fill="#293445" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="24.7" y="72.1" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">C</text>
      <text x="24.7" y="89.1" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">+5</text>
      <path d="M-64.2 -91.7 A112 112 0 0 1 -2.0 -112.0 L-0.7 -40.0 A40 40 0 0 0 -22.9 -32.8 Z" fill="#332b40" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="-24.7" y="-80.1" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">F#</text>
      <text x="-24.7" y="-63.1" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">−1</text>
      <path d="M-105.9 -36.5 A112 112 0 0 1 -67.4 -89.4 L-24.1 -31.9 A40 40 0 0 0 -37.8 -13.0 Z" fill="#332b40" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="-64.7" y="-51.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">F</text>
      <text x="-64.7" y="-34.0" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">−2</text>
      <path d="M-107.1 32.7 A112 112 0 0 1 -107.1 -32.7 L-38.3 -11.7 A40 40 0 0 0 -38.3 11.7 Z" fill="#332b40" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="-80.0" y="-4.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">E</text>
      <text x="-80.0" y="13.0" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">−3</text>
      <path d="M-67.4 89.4 A112 112 0 0 1 -105.9 36.5 L-37.8 13.0 A40 40 0 0 0 -24.1 31.9 Z" fill="#332b40" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="-64.7" y="43.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Eb</text>
      <text x="-64.7" y="60.0" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">−4</text>
      <path d="M-2.0 112.0 A112 112 0 0 1 -64.2 91.7 L-22.9 32.8 A40 40 0 0 0 -0.7 40.0 Z" fill="#332b40" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
      <text x="-24.7" y="72.1" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">D</text>
      <text x="-24.7" y="89.1" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" dominant-baseline="central">−5</text>
      <circle r="36" fill="#141414" fill-opacity="0.92"/>
      <text x="0" y="-4" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono', Menlo, monospace">G → A</text>
      <text x="0" y="13" font-size="7" fill="#ffffff" fill-opacity="0.65" text-anchor="middle" dominant-baseline="central">Drop to transpose</text>
    </g>
  </g>
</svg>
