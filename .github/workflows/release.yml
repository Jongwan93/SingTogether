# Push a tag vX.Y (annotated: its message body becomes the release notes) and this builds the
# self-contained app with dist.sh and publishes the disk image as a GitHub release.
# The tag must match CFBundleShortVersionString in Info.plist.
# A tag vX.Y-dry runs the same build and checks but publishes nothing (to try the workflow).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish again (vX.Y)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag and version must agree
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist)
          DRY=false
          case "$TAG" in *-dry) DRY=true ;; esac
          if [ "${TAG%-dry}" != "v$VERSION" ]; then
            echo "tag $TAG does not match Info.plist version $VERSION"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.3.3     # setup-uv publishes no floating major tag past v7

      # Optional: the repository secrets SIGNING_P12_BASE64 (base64 of the .p12 made by tools/make-signing-cert.sh) and
      # SIGNING_P12_PASSWORD let every release be signed with the same certificate, so macOS keeps the Files and Folders
      # permission from one version to the next. Without them the app is signed ad hoc, as before.
      - name: Signing certificate (optional)
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no signing secret: ad-hoc signature"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p temp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p temp "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -A
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KC" > /dev/null
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys -passin pass:"$P12_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning
          echo "SINGTOGETHER_SIGN=SingTogether Local Signing" >> "$GITHUB_ENV"

      - name: Build the app and the disk image
        run: ./dist.sh

      - name: Check the disk image
        run: |
          DMG="dist/SingTogether-${{ steps.v.outputs.version }}.dmg"
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | tail -1 | awk -F'\t' '{print $NF}')
          codesign --verify --deep --strict "$MNT/SingTogether.app"
          "$MNT/SingTogether.app/Contents/MacOS/singtogether-transpose" --selftest
          "$MNT/SingTogether.app/Contents/Resources/ocr/bin/singtogether-ocr" --help > /dev/null
          hdiutil detach "$MNT" -quiet

      - name: Release notes (tag message, then the install notes)
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          sed "s/__VERSION__/${{ steps.v.outputs.version }}/g" .github/release-footer.md >> notes.md
          cat notes.md

      - name: Publish
        if: steps.v.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          DMG="dist/SingTogether-${{ steps.v.outputs.version }}.dmg"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" "$DMG" --title "SingTogether ${{ steps.v.outputs.version }}" --notes-file notes.md --verify-tag --latest
          fi
